<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安全ライン 会話ドリル</title>
<style>
  :root{
    --paper:#D9DED7; --card:#F3F5F0; --ink:#19211C; --muted:#5F6A63;
    --line:#C1C9BD; --good:#2E5C4E; --warn:#8A3D2C; --dim:#9AA398;
    --display:"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif;
    --body:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--body);
    font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 18px 80px}

  /* ---------- header / meter (signature) ---------- */
  header{
    position:sticky;top:0;z-index:10;background:var(--paper);
    border-bottom:1px solid var(--line);padding:12px 0 10px;margin-bottom:20px;
  }
  .hdr-row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .scn-name{font-family:var(--display);font-size:15px;letter-spacing:.04em;flex:1;min-width:140px}
  .scn-name em{font-style:normal;color:var(--muted);font-size:11px;font-family:var(--mono);display:block;letter-spacing:.1em}
  .meter-box{flex:2;min-width:200px}
  .meter-lab{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
  .meter-val{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
  .meter-val.hot{color:var(--warn)}
  .delta{font-size:11px;margin-left:6px;opacity:0;transition:opacity .3s}
  .delta.show{opacity:1}
  .delta.up{color:var(--warn)} .delta.dn{color:var(--good)}
  .meter{height:14px;background:transparent;display:flex;gap:2px}
  .seg{flex:1;background:#C8CFC5;transition:background .45s cubic-bezier(.2,.8,.3,1)}
  .seg.on{background:var(--good)}
  .seg.on.hot{background:var(--warn)}
  .ratio{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);margin-top:6px}
  .ratio b{color:var(--ink);font-weight:400}

  /* ---------- log ---------- */
  .log{margin-bottom:22px}
  .line{margin-bottom:14px;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .who{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);margin-bottom:3px}
  .bubble{background:var(--card);border-left:2px solid var(--line);padding:9px 13px}
  .line.me .bubble{background:transparent;border-left:2px solid var(--ink)}
  .line.cue .bubble{background:transparent;border:none;border-top:1px dashed var(--line);
    border-bottom:1px dashed var(--line);padding:8px 0;color:var(--muted);font-family:var(--display);font-size:14px}
  .fb{font-size:12.5px;line-height:1.6;margin-top:6px;padding-left:13px;border-left:2px solid transparent;color:var(--muted)}
  .fb.g{color:var(--good)} .fb.b{color:var(--warn)}
  .fb .card-tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    border:1px solid currentColor;padding:0 4px;margin-right:6px}

  /* ---------- options ---------- */
  .prompt{font-family:var(--display);font-size:14px;color:var(--muted);margin:0 0 10px;letter-spacing:.03em}
  .opt{display:flex;gap:11px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);padding:12px 13px;margin-bottom:8px;cursor:pointer;
    font-family:inherit;font-size:14.5px;line-height:1.6;color:var(--ink);transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--ink);background:#EDF0E9}
  .opt:focus-visible{outline:2px solid var(--good);outline-offset:2px}
  .opt .k{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);
    border:1px solid var(--line);padding:1px 5px;height:fit-content;flex-shrink:0;margin-top:2px}
  .opt[disabled]{opacity:.38;cursor:not-allowed}
  .opt[disabled]:hover{border-color:var(--line);background:var(--card)}
  .locknote{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--warn);margin:-2px 0 10px 0}

  .endbar{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .endbtn{background:transparent;border:1px solid var(--ink);color:var(--ink);
    font-family:var(--body);font-size:13px;padding:8px 18px;cursor:pointer;letter-spacing:.06em}
  .endbtn:hover{background:var(--ink);color:var(--paper)}
  .endnote{font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em}

  /* ---------- select / result ---------- */
  h1{font-family:var(--display);font-size:26px;font-weight:400;letter-spacing:.06em;margin:34px 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:28px}
  .grp{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);
    border-bottom:1px solid var(--line);padding-bottom:5px;margin:26px 0 10px}
  .grp span{letter-spacing:.02em;font-family:var(--body);font-size:11px}
  .pick{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    padding:15px 16px;margin-bottom:9px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .pick:hover{border-color:var(--ink)}
  .pick .t{font-family:var(--display);font-size:16px;letter-spacing:.04em}
  .pick .d{font-size:12.5px;color:var(--muted);margin-top:3px}
  .pick .lv{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted)}

  .axis{margin-bottom:15px}
  .axis-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:4px}
  .axis-h span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
  .axis-bar{height:6px;background:#C8CFC5}
  .axis-fill{height:100%;background:var(--good);transition:width .8s cubic-bezier(.2,.8,.3,1)}
  .axis-fill.low{background:var(--warn)}
  .axis-note{font-size:12px;color:var(--muted);margin-top:4px}
  .verdict{background:var(--card);border-left:2px solid var(--ink);padding:14px 16px;margin:20px 0;font-size:14px}
  .verdict b{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.04em}
  hr{border:none;border-top:1px solid var(--line);margin:26px 0}
  .small{font-size:12px;color:var(--muted)}
  @media(max-width:560px){
    .hdr-row{gap:8px}.meter-box{flex:1 0 100%}.scn-name{flex:1 0 100%}
    h1{font-size:22px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   安全ライン 会話ドリル / プロトタイプ
   分岐固定型・API不要
   採点軸: 2-1 手札 / 2-2 支持応答 / 2-3 開示階層 / 2-4 負荷 / 2-5 終了
   ============================================================ */

/* 手札
   S = 振る（起点）  A = 掘る  B = 映す  C = 出す  D = 置く（そのままにしておく／期待しない）  E = 終える
   s: {t:手札運用, u:支持応答, d:開示階層, l:負荷管理}  各 -2〜2
   ld: 負荷メーター増減                                                    */

const SCEN = [
{
 id:"w1", title:"職場・休憩スペース", lv:1,

     fb:"正解。いま目の前にあるものから拾う起点。相手は答えるのが楽で、答えなくても成立する。",g:1,

    {k:"S",t:"「今日、外めちゃくちゃ暑かったですね」",lv:0,ld:0,s:{t:1,u:1,d:1,l:1},

     re:"「ですね……もう外出たくないです」"},
    {k:"A",t:"「○○さんって、休憩いつも何時ごろ取るんですか」",lv:0,ld:14,s:{t:-1,u:0,d:-1,l:-2},
     fb:"行動パターンを聞く質問は、初手では監視の匂いが出る。相手は「なぜ知りたいのか」を処理させられる。",g:-1,
     re:"「え……特に決まってないですけど」"},
    {k:"C",t:"「いや〜今日ほんと忙しくて。朝から会議3本で参りましたよ」",lv:1,ld:10,s:{t:-1,u:-2,d:0,l:-1},
     fb:"受けも起点もなく自分の話から入っている。相手には聞く義務だけが発生する。",g:-1,
     re:"「あー……お疲れさまです」"}]},

  {npc:"「前より濃い気がするんですよね」",nlv:1,
   prompt:"手札を1枚だけ出す",
   opts:[
    {k:"B",t:"「へえ、濃くなったんですね」",lv:0,ld:-3,s:{t:2,u:2,d:1,l:1},
     fb:"映す。質問していないのに会話が前に進む。安全ラインで最も使用頻度が高い手。",g:1,
     re:"「そう。私は前のほうが好きだったかも」"},
    {k:"A",t:"「へえ。どっちが好きですか」",lv:0,ld:-2,s:{t:2,u:2,d:1,l:1},

     re:"「前のほうかな。薄いほうが何杯も飲めるので」"},
    {k:"A",t:"「誰が決めてるんですか？ 経費って部署持ちですか？」",lv:0,ld:12,s:{t:-2,u:0,d:0,l:-2},
     fb:"事実層の質問を2つ重ねている。1ターン1手の違反。尋問になる。",g:-1,
     re:"「……さあ、総務じゃないですかね」"},
    {k:"C",t:"「俺コーヒー詳しくて、豆から挽いてるんですよ。ミルも3種類あって」",lv:1,ld:13,s:{t:-1,u:-2,d:0,l:-1},
     fb:"話題を奪う転換応答。主語が自分に移り、相手は自分の話を切り上げさせられた。",g:-1,
     re:"「……へえ、すごいですね」"}]},

  {npc:"「薄いほうが何杯も飲めるので」",nlv:1,
   prompt:"手札を1枚だけ出す",
   opts:[
    {k:"C",t:"「わかります。気づくと4杯目とか行ってます」",lv:1,ld:-3,s:{t:2,u:1,d:2,l:1},
     fb:"短い自己開示。相手と同じ深さ（Lv1）で10秒以内。C はこのくらいの分量が上限。",g:1,
     re:"「(笑) 多いですよね。午後には手が震えてます」"},
    {k:"B",t:"「何杯も飲むタイプなんですね」",lv:0,ld:-1,s:{t:1,u:2,d:0,l:1},
     fb:"安全だが、B が続くと相手だけが話す形になる。ここは C を1枚使ってよい場面。",g:0,
     re:"「まあ、多いですね。午後には手が震えてます」"},
    {k:"C",t:"「俺、昔カフェでバイトしてて。そのとき店長がやたら豆にうるさい人で、毎朝ドリップの温度を──」",lv:1,ld:11,s:{t:-2,u:-2,d:0,l:-1},

     re:"「……あ、はい」"},
    {k:"A",t:"「一日何杯くらい飲むんですか」",lv:0,ld:4,s:{t:0,u:1,d:0,l:0},

     re:"「んー、5杯とか？ 午後には手が震えてます」"}]},

  {npc:"「(笑) 午後には手が震えてます」",nlv:1,
   prompt:"手札を1枚だけ出す",
   opts:[
    {k:"C",t:"「俺も一時期やばくて、いまは午後だけデカフェにしてます」",lv:1,ld:-2,s:{t:2,u:1,d:2,l:1},
     fb:"同レベルの開示で、押し付けがましくない。解決策ではなく自分の対処を短く言うだけに留めているのが良い。",g:1,

    {k:"B",t:"「効きすぎるとそうなりますよね」",lv:0,ld:-1,s:{t:1,u:2,d:0,l:1},
     fb:"安全。ただし B が連続すると相手側の発話負担が偏る。",g:0,

    {k:"C",t:"「それ大丈夫ですか。身体壊しますよ。ちゃんと水も飲んだほうがいい」",lv:2,ld:16,s:{t:-1,u:-1,d:-1,l:-2},

     re:"「……あ、はい。気をつけます」"},
    {k:"A",t:"「そんなに飲むって、仕事けっこう詰まってるんですか」",lv:0,ld:8,s:{t:-1,u:1,d:-1,l:-1},
     fb:"背景層への踏み込み。まだ関係が温まっていない段階で、説明責任を負わせている。",g:-1,
     re:"「まあ……普通ですけど」"}]},

  {cue:"3秒ほど沈黙が落ちた。",
   prompt:"沈黙が落ちたときの一手",
   opts:[
    {k:"S",t:"「そういえば、さっきの入れ替えって部署ごとなんですか」",lv:0,ld:-2,s:{t:2,u:2,d:1,l:1},
     fb:"既出の話題に戻す起点。文脈があるので相手が答えやすく、唐突さがない。",g:1,
     re:"「たしか総務がまとめて決めてるはずです」"},
    {k:"D",t:"（何も言わず、カップを片付ける）",lv:0,ld:-3,s:{t:2,u:1,d:0,l:2},
     fb:"沈黙を許容する。3秒の沈黙は事故ではない。埋めないほうが軽い場面は多い。",g:1,
     re:"「……(相手も静かにコーヒーを飲んでいる)」"},
    {k:"S",t:"「○○さんって、休みの日とか何してるんですか」",lv:0,ld:15,s:{t:-2,u:0,d:-2,l:-2},
     fb:"文脈のない私生活への転換。沈黙を埋めるためだけに深いほうへ飛んでいる。典型的な失点。",g:-1,
     re:"「え、休みですか……普通に寝てます」"},
    {k:"C",t:"「あ、なんか喋ること無くなっちゃいましたね（笑）」",lv:1,ld:12,s:{t:-2,u:-1,d:-1,l:-2},

  {npc:"「……あ、そろそろ戻らないと」",nlv:0,cut:1,
   prompt:"撤退シグナルが出た",

    {k:"E",t:"「了解です。じゃあまた」",lv:0,ld:-8,s:{t:2,u:1,d:1,l:2},end:1,

     re:"「はい、また」"},
    {k:"C",t:"「あ、もうちょっとだけ。あと1個だけ聞きたくて」",lv:1,ld:26,s:{t:-2,u:-2,d:-1,l:-2},

     re:"「あ、はい、ありがとうございます」"}]},

  {npc:"（相手はカップを流しに置いて、出口のほうを見ている）",nlv:0,cut:1,
   prompt:"まだ終えていない",
   opts:[
    {k:"E",t:"「あ、すみません、引き止めちゃって。じゃあ」",lv:0,ld:-4,s:{t:1,u:1,d:0,l:1},end:1,
     fb:"遅れたが撤退できた。ただし謝罪を足すと、相手に「大丈夫ですよ」を言わせることになる。「じゃあまた」だけで足りる。",g:0,
     re:"「いえ。じゃあ」"},
    {k:"A",t:"「あ、最後にひとつだけいいですか」",lv:1,ld:22,s:{t:-2,u:-1,d:-1,l:-2},
     fb:"相手はすでに2回、出口を示している。ここで止めるのは境界線の侵犯。",g:-1,
     re:"「……はい」"},
    {k:"D",t:"（黙って相手が出て行くのを待つ）",lv:0,ld:6,s:{t:0,u:0,d:0,l:0},

  {npc:"（相手は出て行った）",nlv:0,cut:1,

    {k:"E",t:"（終える）",lv:0,ld:0,s:{t:0,u:0,d:0,l:0},end:1,
     fb:"終了の主導権を持てなかった。会話全体の印象は終端に強く規定される。",g:-1,re:""}]}
 ]},

/* ---------------------------------------------------------- */
{
 id:"w2", title:"職場・反応が薄い日", lv:2,

  {npc:"（相手は短く返して、またスマホに視線を戻した）",nlv:0,

const LVD={1:"反応が良い相手。手札の基本を回す",2:"反応が薄い／深い話が出る。置くと階層合わせが要る",3:"追撃と役割固定の罠。安全ライン最難関"};

const AXES=[
 {k:"t",n:"2-1 ターン運用",d:"受け＋1手。2枚出し・質問過多をしていないか"},
 {k:"u",n:"2-2 支持応答",d:"主語を相手に置けているか。話題を奪っていないか"},
 {k:"d",n:"2-3 開示階層",d:"相手のレベル＋1以内で返せているか"},
 {k:"l",n:"2-4 負荷管理",d:"圧・追撃・境界侵犯をしていないか"}
];

/* ---------------- state ---------------- */
let S=null;
const app=document.getElementById('app');

function selectScreen(){
  S=null;
  app.innerHTML=`
  <h1>安全ライン 会話ドリル</h1>
  <p class="sub">1ターンごとに手札を1枚選ぶ。目的は好かれることではなく、相手の負荷を上げないこと。</p>
  ${[1,2,3].map(lv=>{
    const g=SCEN.map((s,i)=>({s,i})).filter(x=>x.s.lv===lv);
    if(!g.length) return '';
    return `<div class="grp">LV ${lv}　<span>${LVD[lv]}</span></div>` + g.map(x=>`
    <button class="pick" onclick="start(${x.i})">
      <div class="t">${x.s.title}</div>
      <div class="d">${x.s.desc}</div>
    </button>`).join('');
  }).join('')}
  <hr>
  <p class="small">
    手札　<b>S</b> 振る（起点）／<b>A</b> 掘る／<b>B</b> 映す／<b>C</b> 出す／<b>D</b> 置く／<b>E</b> 終える<br>
    <span style="color:var(--muted)">D 置く＝何も足さず、そのままにしておく手。相手に何かを期待していない状態を指す。黙って固まることではない。</span><br>
    「終える」はいつでも押せる。早すぎても遅すぎても減点される。
  </p>`;
}

function start(i){
  const sc=SCEN[i];
  S={sc,turn:0,load:sc.start,log:[],cards:{S:0,A:0,B:0,C:0,D:0,E:0},
     earn:{t:0,u:0,d:0,l:0},max:{t:0,u:0,d:0,l:0},closedAt:null,over:false,bail:false};
  render();
}

function choose(oi){
  const T=S.sc.turns[S.turn], o=T.opts[oi];
  // score
  for(const a of ['t','u','d','l']){
    const best=Math.max(...T.opts.map(x=>x.s[a]));
    if(best>0){ S.max[a]+=best; S.earn[a]+=Math.max(0,o.s[a]); }
  }
  S.cards[o.k]=(S.cards[o.k]||0)+1;
  const before=S.load;
  S.load=Math.max(0,Math.min(100,S.load+o.ld));
  S.delta=S.load-before;

  S.log.push({me:o.t,k:o.k,fb:o.fb,g:o.g});
  if(o.re) S.log.push({npc:o.re});

  if(o.end){ S.closedAt=S.turn+1; return finish(); }
  if(S.load>=88){ S.bail=true; S.closedAt=S.turn+1; return finish(); }

  S.turn++;
  if(S.turn>=S.sc.turns.length) return finish();
  render();
}

function endNow(){
  S.closedAt=S.turn+1;
  S.log.push({me:"（自分から会話を終えた）",k:"E",fb:"",g:0});
  finish();
}

function render(){
  const sc=S.sc, T=sc.turns[S.turn];
  // log entries for this turn
  if(T.cue) S.log.push({cue:T.cue});
  else if(T.npc) S.log.push({npc:T.npc});

  const segs=Array.from({length:20},(_,i)=>{
    const on=(i+1)*5<=S.load;
    return `<div class="seg ${on?'on':''} ${on&&S.load>=65?'hot':''}"></div>`;
  }).join('');

  const dl=S.delta;
  const dtxt=dl===undefined||dl===0?'':(dl>0?`+${dl}`:`${dl}`);

  // lock rule: 撤退シグナル後は引く系のみ
  const cut=T.cut;

  app.innerHTML=`
  <header>
    <div class="hdr-row">
      <div class="scn-name"><em>SCENARIO / LV${sc.lv}</em>${sc.title}</div>
      <div class="meter-box">
        <div class="meter-lab">
          <span>相手の負荷</span>
          <span class="meter-val ${S.load>=65?'hot':''}">${String(S.load).padStart(2,'0')}
            <span class="delta show ${dl>0?'up':'dn'}">${dtxt}</span></span>
        </div>
        <div class="meter">${segs}</div>
        <div class="ratio">手札　A <b>${S.cards.A}</b>　B <b>${S.cards.B}</b>　C <b>${S.cards.C}</b>　S <b>${S.cards.S}</b>　D <b>${S.cards.D}</b>　　ターン <b>${S.turn+1}</b>/${sc.turns.length}</div>
      </div>
    </div>
  </header>

  <div class="log">${S.log.map(renderLine).join('')}</div>

  <p class="prompt">${T.prompt}</p>
  ${cut?'<div class="locknote">相手は終わりの合図を出している</div>':''}
  ${T.opts.map((o,i)=>`
    <button class="opt" onclick="choose(${i})">
      <span class="k">${o.k}</span><span>${o.t}</span>
    </button>`).join('')}

  <div class="endbar">
    <button class="endbtn" onclick="endNow()">会話を終える</button>
    <span class="endnote">いつでも押せる</span>
  </div>`;
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

function renderLine(l){
  if(l.cue) return `<div class="line cue"><div class="bubble">${l.cue}</div></div>`;
  if(l.npc) return `<div class="line"><div class="who">相手</div><div class="bubble">${l.npc}</div></div>`;
  return `<div class="line me"><div class="who">自分</div><div class="bubble">${l.me}</div>
    ${l.fb?`<div class="fb ${l.g>0?'g':l.g<0?'b':''}"><span class="card-tag">${l.k}</span>${l.fb}</div>`:''}</div>`;
}

/* ---------------- result ---------------- */
function closeScore(){
  const [a,b]=S.sc.closeWin, c=S.closedAt;
  if(c===null) return [0,"終了の主導権を持てなかった。会話全体の印象は終端に規定される。"];
  if(c<a) return [55,`ターン${c}で終了。早すぎる。相手が開く前に切っており、関係が積み上がらない。`];
  if(c<=b) return [100,`ターン${c}で終了。適切。まだ話せる状態で、自分から切れている。`];
  if(c<=b+2) return [60,`ターン${c}で終了。やや粘っている。話題が枯れてから終えると、間延びした印象が残る。`];
  return [20,`ターン${c}で終了。粘りすぎ。相手が複数回、終わりの合図を出している。`];
}

function finish(){
  const sc=S.sc;
  const pct=k=>S.max[k]?Math.round(S.earn[k]/S.max[k]*100):100;
  const [cs,cnote]=closeScore();
  const scores=AXES.map(a=>({...a,v:pct(a.k)})).concat([{k:"c",n:"2-5 終了設計",d:"自分から、適切なタイミングで終えたか",v:cs,note:cnote}]);
  const avg=Math.round(scores.reduce((s,x)=>s+x.v,0)/scores.length);

  const cTotal=S.cards.A+S.cards.B+S.cards.C;
  const cRatio=cTotal?Math.round(S.cards.C/cTotal*100):0;

  let verdict;
  if(S.bail) verdict=`<b>相手が離脱した</b><br>負荷が上限に達した。この段階では、会話を続けることより、相手の警戒を上げないことが優先される。`;
  else if(avg>=85) verdict=`<b>安全ライン通過圏</b><br>相手の負荷を上げずに会話を運用し、自分から終えられている。この状態を複数の相手・複数の場面で再現できるかが次の課題。`;
  else if(avg>=65) verdict=`<b>通過手前</b><br>大枠は運用できているが、特定の軸で落ちている。下のスコアで最も低い軸だけを次の1週間の課題にする。`;
  else verdict=`<b>未通過</b><br>複数の軸で負荷を発生させている。まず最も低い軸ひとつに絞る。全部を同時に直そうとすると何も定着しない。`;

  app.innerHTML=`
  <h1>結果</h1>
  <p class="sub">${sc.title}　LV${sc.lv}　最終負荷 ${S.load}</p>
  <div class="verdict">${verdict}</div>

  ${scores.map(s=>`
    <div class="axis">
      <div class="axis-h"><span>${s.n}</span><span>${s.v}</span></div>
      <div class="axis-bar"><div class="axis-fill ${s.v<60?'low':''}" style="width:${s.v}%"></div></div>
      <div class="axis-note">${s.note||s.d}</div>
    </div>`).join('')}

  <div class="axis">
    <div class="axis-h"><span>手札 C（自分の話）比率</span><span>${cRatio}%</span></div>
    <div class="axis-bar"><div class="axis-fill ${cRatio>35?'low':''}" style="width:${Math.min(100,cRatio*2)}%"></div></div>
    <div class="axis-note">目安 25%前後。A ${S.cards.A} / B ${S.cards.B} / C ${S.cards.C} / S ${S.cards.S} / D ${S.cards.D}</div>
  </div>

  <hr>
  <h1 style="font-size:19px;margin-top:0">ログ</h1>
  <div class="log">${S.log.map(renderLine).join('')}</div>
  <hr>
  <button class="endbtn" onclick="selectScreen()">シナリオを選び直す</button>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

selectScreen();
</script>
